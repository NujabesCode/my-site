<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="홍길동의 자기소개 페이지입니다.">
  <title>홍길동 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>홍길동</h1>
    <p class="tagline">새로운 것을 배우고 만드는 걸 좋아하는 개발자입니다.</p>
  </header>

  <main>
    <section id="about" class="section">
      <h2>소개</h2>
      <p>
        안녕하세요, 홍길동입니다. 웹 개발을 공부하고 있으며,
        사람들에게 도움이 되는 서비스를 만드는 것이 목표입니다.
        작은 프로젝트부터 하나씩 차근차근 쌓아가고 있어요.
      </p>
    </section>

    <section id="favorites" class="section">
      <h2>좋아하는 것 3가지</h2>
      <ul class="cards">
        <li class="card">
          <span class="emoji" aria-hidden="true">☕</span>
          <h3>커피</h3>
          <p>아침을 여는 따뜻한 커피 한 잔.</p>
        </li>
        <li class="card">
          <span class="emoji" aria-hidden="true">📚</span>
          <h3>독서</h3>
          <p>새로운 생각을 만나는 시간.</p>
        </li>
        <li class="card">
          <span class="emoji" aria-hidden="true">🎵</span>
          <h3>음악</h3>
          <p>코딩할 때 함께하는 플레이리스트.</p>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 홍길동. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
