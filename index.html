<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>홍길동</h1>
    <p class="tagline">새로운 것을 배우고 만드는 걸 좋아하는 사람입니다.</p>
  </header>

  <main>
    <section id="about">
      <h2>소개</h2>
      <p>안녕하세요! 저는 홍길동입니다. 요즘은 Git 과 웹 개발을 배우고 있어요.</p>
    </section>

    <section id="favorites">
      <h2>좋아하는 것 3가지</h2>
      <div class="cards">
        <article class="card">
          <div class="card-icon">🎧</div>
          <h3>음악 듣기</h3>
          <p>하루를 시작할 때 꼭 플레이리스트를 틀어요.</p>
        </article>
        <article class="card">
          <div class="card-icon">🚶</div>
          <h3>산책하기</h3>
          <p>머리가 복잡할 땐 동네 한 바퀴가 최고예요.</p>
        </article>
        <article class="card">
          <div class="card-icon">☕</div>
          <h3>맛있는 커피</h3>
          <p>새로운 카페를 찾아다니는 게 취미예요.</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 홍길동</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
